<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blocky 可视化编程</title>
  <link rel="stylesheet" href="style.css" />

  <script src="vendor/blockly_compressed.js"></script>
  <script src="vendor/blocks_compressed.js"></script>
  <script src="vendor/msg_zh-hans.js"></script>
  <script src="vendor/python_compressed.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img class="brand-logo" src="img/icon.png" alt="Blocky" />
          <span>Blocky</span>
        </div>
        <div class="sidebar-header-actions">
          <button class="icon-btn" id="collapseBtn" title="折叠/展开侧栏">
            <img class="icon" src="img/minus.png" alt="折叠" />
          </button>
          <button class="btn btn-ghost" id="newBtn" title="新建程序">
            <img class="icon" src="img/add.png" alt="新建" />
            <span>新建</span>
          </button>
        </div>
      </div>
      <div class="sidebar-actions">
        <button class="btn btn-ghost btn-sm" id="exportAllBtn">导出全部</button>
        <button class="btn btn-ghost btn-sm" id="importBtn">导入</button>
        <button class="btn btn-ghost btn-sm" id="refreshBtn">刷新</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden />
      <div class="program-list" id="programList"></div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <div class="toolbar-left">
          <input class="input name-input" id="nameInput" placeholder="程序名称" />
          <span class="ctype-badge" id="ctypeBadge" title="程序类型">积木</span>
          <span class="id-badge" id="idBadge" title="程序 ID"></span>
        </div>
        <div class="toolbar-right">
          <label class="switch-wrap" title="启用该程序">
            <input type="checkbox" id="enabledCheck" />
            <span>启用</span>
          </label>
          <button class="btn" id="resetBtn" title="放弃未保存修改，重新加载当前程序">
            <img class="icon" src="img/reset.png" alt="重置" />
            <span>重置</span>
          </button>
          <button class="btn btn-primary" id="saveBtn">保存</button>
          <button class="btn" id="testBtn">测试运行</button>
        </div>
      </header>

      <div class="settings-bar">
        <label>触发条件
          <select class="select" id="triggerType">
            <option value="all">全部消息</option>
            <option value="contains">包含关键词</option>
            <option value="prefix">前缀匹配</option>
            <option value="regex">正则匹配</option>
            <option value="admin_only">仅管理员</option>
          </select>
        </label>
        <input class="input trigger-value" id="triggerValue" placeholder="关键词 / 前缀 / 正则" />
        <label>优先级
          <input class="input number" type="number" id="priorityInput" value="0" />
        </label>
        <label>超时(秒)
          <input class="input number" type="number" id="timeoutInput" value="30" />
        </label>
        <div class="models-field" title="「AI 回答」积木可用的模型白名单，留空表示不限制">
          <label for="modelInput">可用模型</label>
          <div class="chips" id="modelChips"></div>
          <div class="model-add-row">
            <input class="input model-input" id="modelInput" list="modelList"
              placeholder="输入模型名后回车添加" />
            <datalist id="modelList"></datalist>
            <button class="btn btn-sm" id="addModelBtn" title="添加模型">+ 添加</button>
            <button class="btn btn-sm" id="loadModelsBtn" title="加载当前可用模型">加载可用模型</button>
          </div>
        </div>
        <input class="input desc-input" id="descriptionInput" placeholder="描述（可选）" />
      </div>

      <div class="tabs">
        <button class="tab" data-mode="blockly" id="tabBlockly">积木模式</button>
        <button class="tab" data-mode="python" id="tabPython">代码模式</button>
      </div>

      <div class="editor-area">
        <div id="blocklyDiv"></div>
        <textarea id="codeEditor" spellcheck="false" placeholder="# 在此直接编写 Python 代码&#10;# 可用：event（消息事件）、ctx（AstrBot 上下文）、_blk（Blocky 操作对象）&#10;# 示例：&#10;await _blk.reply('你好，' + _blk.get_sender_name())"></textarea>
      </div>

      <section class="test-panel" id="testPanel">
        <div class="test-title">测试运行</div>
        <div class="test-row">
          <textarea class="input test-message" id="testMessage" rows="2" placeholder="输入一条模拟消息（如：你好）"></textarea>
          <div class="test-opts">
            <label><input type="checkbox" id="testAdmin" /> 管理员</label>
            <label><input type="checkbox" id="testPrivate" /> 私聊</label>
          </div>
        </div>
        <textarea class="input test-chat" id="testChat" rows="2" placeholder="可选：AI 回答的模拟结果（JSON，如 {\"你好\":\"你好呀\"}）"></textarea>
        <pre class="test-result" id="testResult"></pre>
      </section>
    </main>
  </div>

  <!-- 通用确认弹窗 -->
  <div class="modal-overlay hidden" id="confirmModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-title" id="confirmTitle">提示</div>
      <div class="modal-message" id="confirmMessage"></div>
      <div class="modal-actions">
        <button class="btn" id="confirmCancel">取消</button>
        <button class="btn btn-primary" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <!-- 新建程序弹窗 -->
  <div class="modal-overlay hidden" id="createModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-title">新建程序</div>
      <div class="form-row">
        <label for="createName">程序名称</label>
        <input class="input" id="createName" placeholder="输入程序名称" />
        <div class="form-hint" id="createNameHint"></div>
      </div>
      <div class="form-row">
        <label>编辑方式</label>
        <div class="radio-row">
          <label class="radio-label">
            <input type="radio" name="createType" value="blockly" checked />
            积木模式
          </label>
          <label class="radio-label">
            <input type="radio" name="createType" value="python" />
            代码模式
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="createCancel">取消</button>
        <button class="btn btn-primary" id="createOk">创建</button>
      </div>
    </div>
  </div>

  <xml id="toolbox" style="display: none">
    <category name="事件" colour="#5C81A6">
      <block type="blocky_event"></block>
    </category>
    <category name="消息" colour="#5B67A5">
      <block type="blocky_get_message"></block>
      <block type="blocky_get_sender_name"></block>
      <block type="blocky_get_sender_id"></block>
      <block type="blocky_get_group_id"></block>
      <block type="blocky_get_session"></block>
      <block type="blocky_get_platform"></block>
      <block type="blocky_is_admin"></block>
      <block type="blocky_is_private"></block>
    </category>
    <category name="回复与发送" colour="#5BA58C">
      <block type="blocky_return_msg"></block>
      <block type="blocky_reply"></block>
      <block type="blocky_forward"></block>
      <block type="blocky_stop"></block>
      <block type="blocky_send"></block>
    </category>
    <category name="AI" colour="#A5745B">
      <block type="blocky_chat"></block>
    </category>
    <category name="HTTP 网络" colour="#A5855B">
      <block type="blocky_http_get"></block>
      <block type="blocky_http_get_json"></block>
      <block type="blocky_http_post"></block>
      <block type="blocky_http_post_json"></block>
      <block type="blocky_dict_get"></block>
    </category>
    <category name="其他" colour="#A55B5B">
      <block type="blocky_log"></block>
      <block type="blocky_sleep"></block>
    </category>
    <category name="逻辑" colour="#5C81A6">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_boolean"></block>
      <block type="logic_null"></block>
      <block type="logic_ternary"></block>
    </category>
    <category name="循环" colour="#5BA58C">
      <block type="controls_repeat_ext"></block>
      <block type="controls_whileUntil"></block>
      <block type="controls_for"></block>
      <block type="controls_forEach"></block>
      <block type="controls_flow_statements"></block>
    </category>
    <category name="数学" colour="#5B67A5">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
      <block type="math_single"></block>
      <block type="math_trig"></block>
      <block type="math_constant"></block>
      <block type="math_round"></block>
      <block type="math_modulo"></block>
      <block type="math_constrain"></block>
      <block type="math_random_int"></block>
      <block type="math_random_float"></block>
    </category>
    <category name="文本" colour="#A5745B">
      <block type="text"></block>
      <block type="text_join"></block>
      <block type="text_append"></block>
      <block type="text_length"></block>
      <block type="text_isEmpty"></block>
      <block type="text_indexOf"></block>
      <block type="text_charAt"></block>
      <block type="text_getSubstring"></block>
      <block type="text_changeCase"></block>
      <block type="text_trim"></block>
      <block type="text_print"></block>
    </category>
    <category name="列表" colour="#A5855B">
      <block type="lists_create_with"></block>
      <block type="lists_repeat"></block>
      <block type="lists_length"></block>
      <block type="lists_isEmpty"></block>
      <block type="lists_indexOf"></block>
      <block type="lists_getIndex"></block>
      <block type="lists_setIndex"></block>
      <block type="lists_getSublist"></block>
      <block type="lists_split"></block>
      <block type="lists_sort"></block>
    </category>
    <category name="变量" colour="#A55B5B" custom="VARIABLE"></category>
    <category name="函数" colour="#5C81A6" custom="PROCEDURE"></category>
  </xml>

  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
